# Databricks Asset Bundle: notebooks + two file-arrival jobs, one per landing folder.
#   databricks bundle validate
#   databricks bundle deploy -t dev
# Run jobs as a service principal in dp_pipelines in uat/prod (run_as below).
bundle:
  name: ai-data-product

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-<workspace-id>.<n>.azuredatabricks.net

resources:
  jobs:
    # On-prem customer extract -> BRONZE operational -> GOLD consumer
    customer_accounts_load:
      name: dp-customer-accounts-load
      trigger:
        file_arrival:
          url: /Volumes/dp_dev/staging/landing/customer_accounts/
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze_operational
          notebook_task:
            notebook_path: ./notebooks/02b_bronze_operational_customer_accounts_ops.py
        - task_key: gold_consumer
          depends_on: [{task_key: bronze_operational}]
          notebook_task:
            notebook_path: ./notebooks/02c_gold_consumer_customer_accounts.py
      email_notifications:
        on_failure: [retail-data-team@bank.example]

    # On-prem branch master -> SILVER reference -> GOLD consumer (re-enrich affected accounts)
    ref_branch_load:
      name: dp-ref-branch-load
      trigger:
        file_arrival:
          url: /Volumes/dp_dev/staging/landing/ref_branch/
      max_concurrent_runs: 1
      tasks:
        - task_key: silver_reference
          notebook_task:
            notebook_path: ./notebooks/02a_silver_reference_ref_branch.py
        - task_key: gold_consumer
          depends_on: [{task_key: silver_reference}]
          notebook_task:
            notebook_path: ./notebooks/02c_gold_consumer_customer_accounts.py
      email_notifications:
        on_failure: [branch-operations@bank.example]
    # Both jobs end in the gold build; it is incremental and idempotent, so overlapping triggers are safe
    # apart from Delta write conflicts, which a retry resolves.
